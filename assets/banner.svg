<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Krishna Singh  Senior Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#BE123C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#BE123C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="8" height="360" fill="url(#accent)"/>

  <!-- decorative arc -->
  <path d="M780 360 C860 180, 980 120, 1200 80" fill="none" stroke="#FB7185" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="1040" cy="96" r="56" fill="none" stroke="#FB7185" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="1040" cy="96" r="18" fill="#BE123C" fill-opacity="0.55"/>

  <text x="64" y="118" fill="#FB7185" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" letter-spacing="4">SENIOR SOFTWARE ENGINEER</text>

  <text x="64" y="188" fill="#F8FAFC" font-family="ui-serif, Georgia, Cambria, Times New Roman, serif" font-size="64" font-weight="700">Krishna Singh</text>

  <text x="64" y="236" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22">Ruby on Rails · Performance · End-to-end product delivery</text>

  <text x="64" y="292" fill="#64748B" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">Mumbai · Remote · 6+ years building &amp; scaling web products</text>
</svg>
